version: '3.8'

services:
  backend-api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Spring Boot bu değişkenleri okuyup veritabanına bağlanacak
      - DB_URL=jdbc:postgresql://tuievolution-postgres:5432/tuievolution_db
      - DB_USER=tuievolution
      - DB_PASS=tui26*Evolution06
    depends_on:
      - tuievolution-postgres

  tuievolution-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: tuievolution
      POSTGRES_PASSWORD: tui26*Evolution06
      POSTGRES_DB: tuievolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: