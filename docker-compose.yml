version: '3.8'

services:
  backend-api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080  # SPRING BOOT'UN BEKLEDİĞİ PORT DEĞİŞKENİ EKLENDİ
      - DB_URL=jdbc:postgresql://tuievolution-postgres:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - tuievolution-postgres
      - tuievolution-mongo

  tuievolution-postgres:
    image: postgres:16  # LATEST YERİNE EN STABİL SÜRÜM OLAN 16'YA SABİTLENDİ
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data: