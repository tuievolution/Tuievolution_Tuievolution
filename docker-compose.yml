version: '3.8'

services:
  backend-api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Backend, veritabanına Docker'ın kendi iç ağından bağlanır (Burada 5432 kalmalı!)
      - DB_URL=jdbc:postgresql://tuievolution-postgres:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - tuievolution-postgres
      - tuievolution-mongo

  tuievolution-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # KRİTİK NOKTA: Dışarıya 5433 portunu açtık, çakışmayı önledik.

  tuievolution-mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}

volumes:
  postgres_data: